<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MiniWiki{% endblock %}</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        nav { margin-bottom: 20px; padding: 10px; background: #f0f0f0; border-radius: 4px; }
        nav a { margin-right: 15px; text-decoration: none; color: #0366d6; }
        nav a:hover { text-decoration: underline; }
        .actions { margin-top: 20px; padding-top: 15px; border-top: 1px solid #ddd; }
        .actions a, .actions button { margin-right: 10px; }
        button { cursor: pointer; padding: 5px 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
        th { background: #f5f5f5; }
        a { color: #0366d6; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
        code { background: #f5f5f5; padding: 2px 4px; border-radius: 3px; }
        pre code { background: none; padding: 0; }
    </style>
</head>
<body>
    <nav>
        <a href="/pages">Все страницы</a>
        <a href="/pages/new">Создать страницу</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
