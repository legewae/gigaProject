{% extends "base.html" %}

{% block title %}{{ title }} — MiniWiki{% endblock %}

{% block content %}
<h1>{{ title }}</h1>
{% if page %}
<form method="post" action="/pages{{ page.path }}/edit">
    <label for="path">Путь:</label><br>
    <input type="text" id="path" name="new_path" value="{{ page.path }}" required><br><br>

    <label for="title">Заголовок:</label><br>
    <input type="text" id="title" name="title" value="{{ page.title }}" required><br><br>

    <label for="content">Содержимое (Markdown):</label><br>
    <textarea id="content" name="content" rows="15" style="width: 100%;" required>{{ page.content }}</textarea><br><br>

    <button type="submit">Сохранить</button>
</form>
{% else %}
<form method="post" action="/pages/new">
    <label for="path">Путь:</label><br>
    <input type="text" id="path" name="path" value="/docs/example" required><br><br>

    <label for="title">Заголовок:</label><br>
    <input type="text" id="title" name="title" value="" required><br><br>

    <label for="content">Содержимое (Markdown):</label><br>
    <textarea id="content" name="content" rows="15" style="width: 100%;" required></textarea><br><br>

    <button type="submit">Сохранить</button>
</form>
{% endif %}
{% endblock %}
