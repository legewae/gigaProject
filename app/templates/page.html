{% extends "base.html" %}

{% block title %}{{ page.title }} — MiniWiki{% endblock %}

{% block content %}
<h1>{{ page.title }}</h1>
<p style="color: #666; font-size: 0.9em;">Создана: {{ page.created_at|format_datetime }} | Обновлено: {{ page.updated_at|format_datetime }}</p>
<div>{{ page.content | safe }}</div>
<div class="actions">
    <a href="/pages{{ page.path }}/edit">Редактировать</a>
    <form method="post" action="/pages{{ page.path }}/delete" style="display: inline;">
        <button type="submit" onclick="return confirm('Удалить страницу?')">Удалить</button>
    </form>
</div>
{% endblock %}
